name: Fabric setup DEV (run once)

# Connects the DEV workspace to the develop branch as the service principal
# and commits DEV's items to Git. Run it once, by hand, before locking the branches.
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "requests>=2.31,<3" "azure-identity>=1.15,<2"

      - name: Connect DEV to develop and commit its items
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_GIT_PAT: ${{ secrets.FABRIC_GIT_PAT }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: >
          python .github/scripts/fabric_git.py setup
          --workspace-id "${{ vars.DEV_WORKSPACE_ID }}"
          --branch develop
          --strategy PreferWorkspace