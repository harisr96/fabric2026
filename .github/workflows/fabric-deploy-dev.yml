name: Fabric deploy DEV (update DEV after merge to develop)

on:
  push:
    branches: [develop]
    paths: ["fabric/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-deploy-dev
  cancel-in-progress: false

jobs:
  update-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "requests>=2.31,<3" "azure-identity>=1.15,<2"

      - name: Update DEV from the develop branch
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python .github/scripts/fabric_git.py update --workspace-id "${{ vars.DEV_WORKSPACE_ID }}"