name: Fabric promote (deployment pipeline)

# An approved, merged pull request into test deploys DEV -> TEST.
# An approved, merged pull request into main deploys TEST -> PROD.
on:
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fabric-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional extra approval gate (public repos or GitHub Enterprise only):
    # create Environments "test" and "prod" with Required reviewers, then remove the # below.
    # environment: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - name: Get the code (full history, for the safety checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only run from test or main
        run: |
          case "${{ github.ref_name }}" in
            test|main) echo "Promoting from branch ${{ github.ref_name }}" ;;
            *) echo "STOP: run this workflow from the test or main branch only."; exit 1 ;;
          esac

      - name: Safety check - branch content matches the stage it comes from
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Fabric items live at the repo root; ignore the automation folder and Markdown files.
          ITEMS=(-- . ':(exclude).github' ':(exclude)*.md')
          if [ "${{ github.ref_name }}" = "test" ]; then
            git fetch origin develop
            if ! git diff --quiet origin/develop HEAD "${ITEMS[@]}"; then
              echo "STOP: Fabric items on test differ from develop. Promote to test only by a pull request from develop."
              git diff --stat origin/develop HEAD "${ITEMS[@]}"
              exit 1
            fi
            echo "to=test" >> "$GITHUB_OUTPUT"
            echo "dev_commit=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"
          else
            git fetch origin test
            if ! git diff --quiet origin/test HEAD "${ITEMS[@]}"; then
              echo "STOP: Fabric items on main differ from test. Release to main only by a pull request from test."
              git diff --stat origin/test HEAD "${ITEMS[@]}"
              exit 1
            fi
            test_sha=$(git rev-parse origin/test)
            last_ok=$(gh run list --workflow fabric-promote.yml --branch test --status success --limit 1 --json headSha --jq '.[0].headSha')
            if [ "$last_ok" != "$test_sha" ]; then
              echo "STOP: TEST has not been successfully deployed from the current test branch ($test_sha)."
              echo "Last successful TEST deployment was from: ${last_ok:-none}"
              exit 1
            fi
            echo "to=prod" >> "$GITHUB_OUTPUT"
            echo "dev_commit=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "requests>=2.31,<3" "azure-identity>=1.15,<2"

      - name: Run the deployment pipeline
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          python .github/scripts/fabric_pipeline.py
          --pipeline-id "${{ vars.DEPLOYMENT_PIPELINE_ID }}"
          --to "${{ steps.check.outputs.to }}"
          --dev-workspace-id "${{ vars.DEV_WORKSPACE_ID }}"
          --expected-dev-commit "${{ steps.check.outputs.dev_commit }}"