name: Fabric CI

# Runs on every pull request into develop, test or main.
# Make the "checks" job required in the branch ruleset so a failing check blocks the merge.
on:
  pull_request:
    branches: [develop, test, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Fabric checks
        run: >
          python .github/scripts/ci_checks.py
          --base "${{ github.base_ref }}"
          --head "${{ github.head_ref }}"