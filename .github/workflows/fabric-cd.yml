name: Fabric CD

# CD = continuous delivery. Every step calls .github/scripts/fabric_cd.py.
#
#   Job "update-dev": after a merge into develop (or "Run workflow" by hand, guide Step 7.3)
#                     -> fabric_cd.py update-dev   pulls develop into fabric2026-DEV
#   Job "promote":    after a MERGED pull request into test or main
#                     -> fabric_cd.py promote      deploys DEV -> TEST or TEST -> PROD
#
# Creating a branch, a direct push to test/main, or closing a pull request without merging does nothing.
on:
  push:
    branches: [develop]
    paths-ignore: [".github/**", "**/*.md", "*.md"]   # changes to automation or docs don't touch DEV
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [test, main]

permissions:
  contents: read
  actions: read   # lets the promote job look at earlier runs (PROD safety check)

jobs:
  # ---------------------------------------------------------------------------
  # Update DEV from the develop branch
  # ---------------------------------------------------------------------------
  update-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:            # one DEV update at a time; a second merge waits
      group: fabric-update-dev
      cancel-in-progress: false
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "requests>=2.31,<3" "azure-identity>=1.15,<2"

      - name: Update DEV from the develop branch
        # The three secrets are the service principal's sign-in (guide Step 5.3).
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python .github/scripts/fabric_cd.py update-dev --workspace-id "${{ vars.DEV_WORKSPACE_ID }}"

  # ---------------------------------------------------------------------------
  # Promote: merged PR develop -> test deploys DEV -> TEST,
  #          merged PR test -> main    deploys TEST -> PROD
  # ---------------------------------------------------------------------------
  promote:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:            # one deployment at a time
      group: fabric-promote
      cancel-in-progress: false
    # Optional extra approval gate (public repos or GitHub Enterprise only):
    # create Environments "test" and "prod" with Required reviewers, then remove the # below.
    # environment: ${{ github.event.pull_request.base.ref == 'main' && 'prod' || 'test' }}
    steps:
      - name: Get the merged code (full history, for the safety checks)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Safety check - right source branch, and content matches the stage it comes from
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.base.ref }}
          SOURCE: ${{ github.event.pull_request.head.ref }}
        run: |
          set -e   # stop at the first command that fails

          # Small helper: print a red error with Why / Fix lines, then stop the job.
          stop() {
            echo "::error::$1"
            echo "[ERROR] $1"
            echo "  Why: $2"
            echo "  Fix: $3"
            exit 1
          }

          echo "[INFO] Merged pull request: $SOURCE -> $TARGET (merge commit $(git rev-parse --short HEAD))"
          # Fabric items live at the repo root. The automation folder (.github) and Markdown
          # files are not Fabric items, so the comparisons below ignore them.
          ITEMS=(-- . ':(exclude).github' ':(exclude)*.md')

          if [ "$TARGET" = "test" ]; then
            echo "[STEP] Release to TEST - check 1/2: the pull request came from develop"
            [ "$SOURCE" = "develop" ] || stop "Pull request into test came from '$SOURCE'" \
              "Only develop may be promoted to test." "Close this pull request and open one from develop."
            echo "[OK] Source branch is develop"

            echo "[STEP] Release to TEST - check 2/2: test now has exactly develop's Fabric items"
            git fetch --quiet origin develop
            if ! git diff --quiet origin/develop HEAD "${ITEMS[@]}"; then
              git diff --stat origin/develop HEAD "${ITEMS[@]}"   # list the files that differ
              stop "Fabric items on test differ from develop" \
                "develop changed after this pull request was opened, or test had other changes." \
                "Open a new pull request develop -> test."
            fi
            echo "[OK] test matches develop (commit $(git rev-parse --short origin/develop))"

            # Pass the results to the next step (fabric_cd.py promote).
            echo "to=test" >> "$GITHUB_OUTPUT"
            echo "dev_commit=$(git rev-parse origin/develop)" >> "$GITHUB_OUTPUT"
          else
            echo "[STEP] Release to PROD - check 1/3: the pull request came from test"
            [ "$SOURCE" = "test" ] || stop "Pull request into main came from '$SOURCE'" \
              "Only test may be released to main." "Close this pull request and open one from test."
            echo "[OK] Source branch is test"

            echo "[STEP] Release to PROD - check 2/3: main now has exactly test's Fabric items"
            git fetch --quiet origin test
            if ! git diff --quiet origin/test HEAD "${ITEMS[@]}"; then
              git diff --stat origin/test HEAD "${ITEMS[@]}"
              stop "Fabric items on main differ from test" \
                "test changed after this pull request was opened, or main had other changes." \
                "Open a new pull request test -> main."
            fi
            echo "[OK] main matches test (commit $(git rev-parse --short origin/test))"

            echo "[STEP] Release to PROD - check 3/3: TEST was deployed with these same items"
            # Look through earlier runs of this workflow for the newest successful "promote" job
            # that came from a merged develop -> test pull request (= the last TEST deployment).
            last_ok=""
            for id in $(gh run list --workflow fabric-cd.yml --event pull_request --status success --limit 50 \
                          --json databaseId,headBranch --jq '.[] | select(.headBranch == "develop") | .databaseId'); do
              promoted=$(gh run view "$id" --json jobs --jq '[.jobs[] | select(.name == "promote" and .conclusion == "success")] | length')
              if [ "$promoted" = "1" ]; then
                last_ok=$(gh run view "$id" --json headSha --jq '.headSha')
                echo "[INFO] Last TEST deployment: run $id, develop commit ${last_ok:0:7}"
                break
              fi
            done
            [ -n "$last_ok" ] || stop "No successful TEST deployment found" \
              "PROD may only receive what TEST received first." "Merge a pull request develop -> test and let it deploy."
            git fetch --quiet origin "$last_ok"
            if ! git diff --quiet "$last_ok" origin/test "${ITEMS[@]}"; then
              git diff --stat "$last_ok" origin/test "${ITEMS[@]}"
              stop "TEST was last deployed from ${last_ok:0:7}, which differs from the test branch now" \
                "The newest changes on test were never deployed to TEST." \
                "Merge develop -> test (and let it deploy) before releasing to main."
            fi
            echo "[OK] TEST already has exactly these items"

            echo "to=prod" >> "$GITHUB_OUTPUT"
            echo "dev_commit=" >> "$GITHUB_OUTPUT"
          fi
          echo "[DONE] Safety checks passed - handing over to fabric_cd.py"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "requests>=2.31,<3" "azure-identity>=1.15,<2"

      - name: Run the deployment pipeline
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          python .github/scripts/fabric_cd.py promote
          --pipeline-id "${{ vars.DEPLOYMENT_PIPELINE_ID }}"
          --to "${{ steps.check.outputs.to }}"
          --dev-workspace-id "${{ vars.DEV_WORKSPACE_ID }}"
          --expected-dev-commit "${{ steps.check.outputs.dev_commit }}"